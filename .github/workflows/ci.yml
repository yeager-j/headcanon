name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # The lowest Node that `engines` allows, and the current LTS.
        node: [22, 24]
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Runs the real-Postgres authority contract suite, which skips without it.
      HEADCANON_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:bundle-safety
      - run: npm run check:public-api-docs
      - run: npm test
      - run: npm run check:package
      # Generates the fixture's route types, then type-checks the fixture
      # against them and the built package.
      - run: npm run check:fixture

  # The real-router negative control: a mutation must canonize in place
  # through the actual App Router. The package's jsdom suite cannot observe
  # React's Action scheduling, so only this job can catch a held-open-Action
  # deadlock. The fixture's authority is in memory and needs no database.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: fixture
      # Builds the package and the fixture, then runs Playwright against
      # `next start`, exactly as it runs locally.
      - run: npm run test:e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            fixture/playwright-report/
            fixture/test-results/
          retention-days: 7
